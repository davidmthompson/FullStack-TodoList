name: Update versions in Readme

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Read Versions
        id: versions
        run: |
          # 1. Next.js Version (Assuming in 'web' folder)
          NEXT_VERSION=$(jq -r '.version' web/package.json || echo "NA")
          echo "next=$NEXT_VERSION" >> $GITHUB_OUTPUT

          # 2. Nest.js Version (Assuming in 'backend' folder)
          # Note: Change 'backend' to your actual backend folder name
          NEST_VERSION=$(jq -r '.version' backend/package.json || echo "NA")
          echo "nest=$NEST_VERSION" >> $GITHUB_OUTPUT

          # 3. iOS Version
          # Looks for the first .pbxproj file and extracts MARKETING_VERSION
          PBXPROJ_PATH=$(find . -name "project.pbxproj" | head -n 1)
          if [ -n "$PBXPROJ_PATH" ]; then 
            IOS_VAL=$(grep -m 1 "MARKETING_VERSION" "$PBXPROJ_PATH" | cut -d'=' -f2 | tr -d '; ')
            echo "ios=$IOS_VAL" >> $GITHUB_OUTPUT
          else
            echo "ios=NA" >> $GITHUB_OUTPUT
          fi

      - name: Update Readme
        run: |
          # Use @ as delimiter to prevent issues with slashes or spaces
          sed -i "s@.*@${{ steps.versions.outputs.next }}@g" README.md
          sed -i "s@.*@${{ steps.versions.outputs.nest }}@g" README.md
          sed -i "s@.*@${{ steps.versions.outputs.ios }}@g" README.md

      - name: Commit Changes
        run: |
          git config user.name "Github Actions"
          git config user.email "github-actions@github.com"
          git add README.md
          # Only commit if there are actual changes to prevent workflow failure
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update versions in README" && git push)